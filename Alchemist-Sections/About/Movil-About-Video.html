<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Movil | About Video</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

.video-observer-container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.video-observer-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
</head>

<body>

<div class="video-observer-container" id="videoObserverContainer">

  <video
    id="heroVideo"
    src="https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Videos/Frame-Fenix.mp4"
    preload="auto"
    playsinline
    crossorigin="anonymous"
    loop>
  </video>

</div>

<script>
(() => {

const containerEl = document.getElementById("videoObserverContainer");
const videoEl = document.getElementById("heroVideo");

let isVideoVisible = false;
let userInteracted = false;

/* ===== INTENTO DE PLAY SEGURO ===== */
function safePlayVideo() {
  if (videoEl.readyState < 2) return;

  const playPromise = videoEl.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      // Autoplay con sonido bloqueado → esperar interacción
    });
  }
}

/* ===== PAUSA ===== */
function pauseVideoOnHide() {
  try {
    videoEl.pause();
  } catch (e) {}
}

/* ===== REANUDAR ===== */
function resumeVideoOnShow() {
  safePlayVideo();
}

/* ===== OBSERVADOR DE VISIBILIDAD ===== */
const videoVisibilityObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.target !== containerEl) return;

    if (entry.isIntersecting && entry.intersectionRatio > 0) {
      isVideoVisible = true;
      resumeVideoOnShow();
    } else {
      isVideoVisible = false;
      pauseVideoOnHide();
    }
  });
}, { threshold: [0.01] });

videoVisibilityObserver.observe(containerEl);

/* ===== INTERACCIÓN USUARIO (habilita audio) ===== */
function enableAudioByInteraction() {
  userInteracted = true;
  safePlayVideo();
  window.removeEventListener("click", enableAudioByInteraction);
  window.removeEventListener("touchstart", enableAudioByInteraction);
}

window.addEventListener("click", enableAudioByInteraction, { once: true });
window.addEventListener("touchstart", enableAudioByInteraction, { once: true });

/* ===== INICIALIZACIÓN ===== */
function initVideoObserver() {
  videoEl.playsInline = true;
  videoEl.playbackRate = 1.0;

  // Forzar precarga temprana
  videoEl.load();

  const rect = containerEl.getBoundingClientRect();
  const inViewport = rect.top < window.innerHeight && rect.bottom > 0;

  if (inViewport) {
    safePlayVideo();
  } else {
    pauseVideoOnHide();
  }
}

if (document.readyState === "complete") {
  initVideoObserver();
} else {
  window.addEventListener("load", initVideoObserver);
}

})();
</script>

</body>
</html>
