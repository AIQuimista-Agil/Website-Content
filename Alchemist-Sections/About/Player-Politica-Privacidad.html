<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audio | Política de Privacidad</title>

<!-- Fuente Avenir -->
<style>
@font-face {
  font-family: 'Avenir';
  src: local('Avenir'), 
       url('https://fonts.cdnfonts.com/s/15387/AvenirLTStd-Black.woff') format('woff');
  font-weight: bold;
}
</style>

<style>
:root{
  --text: #FFFDE3;
  --hover: #E81F27;
  --wave1: #ff8a00;
  --wave2: #ff4500;
  --wave3: #ffb347;
  --neon-green: rgba(0,255,120,0.90);
}

html,body{
  height:100%;
  margin:0;
  background: transparent;
  font-family: "Avenir", sans-serif;
  -webkit-font-smoothing: antialiased;
  display:flex;
  justify-content:center;
  align-items:center;
}

.player-wrap{
  width:min(420px, 92%);
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,0.04);
  backdrop-filter: blur(8px) saturate(180%);
  border:1px solid rgba(255,255,255,0.08);

  /* efecto 3D */
  box-shadow:
     0 15px 35px rgba(0,0,0,0.55),
     0 8px 16px rgba(0,0,0,0.35),
     inset 0 1px 3px rgba(255,255,255,0.15);

  display:flex;
  gap:14px;
  align-items:center;
  transform: translateZ(0);
}

.cover{
  width:72px;
  height:72px;
  flex:0 0 72px;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;

  /* halo verde neon */
  box-shadow:
    0 0 12px var(--neon-green),
    0 0 25px var(--neon-green),
    0 8px 18px rgba(0,0,0,0.55);
}
.cover img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter: drop-shadow(0 4px 8px rgba(0,255,120,0.35));
}

.title{
  margin:0 0 6px 0;
  color:var(--text);
  font-weight:bold;
  font-size:15px;
  text-shadow:0 0 6px rgba(255,255,255,0.15);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

button.playbtn{
  width:44px;
  height:44px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.03);
  cursor:pointer;
  color:var(--text);
  display:grid;
  place-items:center;
  transition:0.2s ease;
  box-shadow:
    inset 0 0 10px rgba(255,255,255,0.06),
    0 6px 14px rgba(0,0,0,0.45);
}
button.playbtn:hover{
  color:var(--hover);
  transform:scale(1.06) translateY(-2px);
}

.time{
  font-size:13px;
  color:rgba(255,255,255,0.85);
  font-weight:bold;
}

/* canvas ondas */
canvas.wave{
  width:100%;
  height:50px;
  border-radius:10px;
  background:transparent;
  margin-top:6px;
}

/* responsive */
@media(max-width:420px){
  .cover{width:60px;height:60px;flex:0 0 60px;}
  button.playbtn{width:40px;height:40px;}
}
</style>
</head>

<body>
<div class="player-wrap" id="player">
  <div class="cover">
    <img src="https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Images/AI%20Logo%20Esmeralda%20-%20Transparente.png">
  </div>

  <div class="meta">
    <h1 class="title">Audio | Política de Privacidad</h1>

    <div class="controls">
      <button class="playbtn" id="playBtn" aria-label="Reproducir">
        <svg id="iconPlay" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="20" height="20" fill="currentColor" style="display:none" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <div style="flex:1;margin-left:6px;">
        <canvas id="wave" class="wave"></canvas>
        <div style="display:flex;justify-content:space-between;margin-top:6px;">
          <span style="color:rgba(255,255,255,0.85);font-size:13px;">Política de Privacidad</span>
          <span class="time" id="time">0:00</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* AUDIO */
const audioUrl = "https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Records/Politica%20Privacidad.m4a";
const audio = new Audio(audioUrl);
audio.crossOrigin = "anonymous";
audio.preload = "auto";

/* botones */
const playBtn = document.getElementById("playBtn");
const iconPlay = document.getElementById("iconPlay");
const iconPause = document.getElementById("iconPause");
const timeEl = document.getElementById("time");

/* visualizador */
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioContext();
const analyser = ctx.createAnalyser();
analyser.fftSize = 2048;

const source = ctx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(ctx.destination);

/* canvas */
const canvas = document.getElementById("wave");
const dpr = window.devicePixelRatio || 1;

canvas.width = canvas.clientWidth * dpr;
canvas.height = canvas.clientHeight * dpr;

const c = canvas.getContext("2d");
c.scale(dpr, dpr);

function draw(){
  requestAnimationFrame(draw);

  const buffer = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buffer);

  c.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

  /* fuego dinámico */
  const grad = c.createLinearGradient(0,0,canvas.clientWidth,0);
  grad.addColorStop(0, "#ff8a00");
  grad.addColorStop(0.5, "#ff4500");
  grad.addColorStop(1, "#ffb347");

  c.lineWidth = 3;
  c.strokeStyle = grad;

  c.beginPath();
  const slice = canvas.clientWidth / buffer.length;

  for(let i=0;i<buffer.length;i++){
    const v = buffer[i] / 128.0;
    const y = (v * canvas.clientHeight/2);

    if(i===0) c.moveTo(0,y);
    else c.lineTo(i * slice, y);
  }
  c.stroke();

  /* brillo suave */
  c.globalCompositeOperation = "lighter";
  c.fillStyle = "rgba(255,120,0,0.06)";
  c.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
  c.globalCompositeOperation = "source-over";
}
draw();

/* PLAY / PAUSE */
playBtn.addEventListener("click", async ()=>{
  if(ctx.state === "suspended") await ctx.resume();

  if(audio.paused){
    audio.play();
    iconPlay.style.display="none";
    iconPause.style.display="block";
  } else {
    audio.pause();
    iconPlay.style.display="block";
    iconPause.style.display="none";
  }
});

/* tiempo */
audio.addEventListener("timeupdate", ()=>{
  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60).toString().padStart(2,"0");
  timeEl.textContent = `${m}:${s}`;
});

/* STOP + RESET cuando no está visible */
const player = document.getElementById("player");
const io = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(!entry.isIntersecting){
      if(!audio.paused){
        audio.pause();
        audio.currentTime = 0;
        iconPlay.style.display = "block";
        iconPause.style.display = "none";
      }
    }
  });
},{threshold:0.5});
io.observe(player);

/* reset cuando termina */
audio.addEventListener("ended", ()=>{
  audio.currentTime = 0;
  iconPlay.style.display="block";
  iconPause.style.display="none";
});
</script>
</body>
</html>
