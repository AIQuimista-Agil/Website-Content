<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audio | Política de Privacidad</title>

<style>
@font-face {
  font-family: 'Avenir';
  src: local('Avenir'),
       url('https://fonts.cdnfonts.com/s/15387/AvenirLTStd-Black.woff') format('woff');
  font-weight: bold;
}

:root{
  --txt: #d9faff;
  --hover: #ff2d63;
  --cyan: #00eaff;
  --magenta: #ff2dfc;
  --purple: #8a3aff;
}

html,body{
  height:100%;
  margin:0;
  background: transparent;
  font-family:"Avenir", sans-serif;
  -webkit-font-smoothing:antialiased;

  display:flex;
  align-items:center;
  justify-content:center;
}

.player{
  width:min(390px,95%);
  padding:18px 16px;
  border-radius:18px;

  /* CYBERPUNK */
  background:rgba(12,14,20,0.55);
  backdrop-filter: blur(10px) saturate(180%);
  border:1px solid rgba(0,255,255,0.18);
  box-shadow:
     0 0 20px rgba(0,255,255,0.25),
     0 0 35px rgba(255,0,255,0.15),
     inset 0 0 18px rgba(0,255,255,0.08);

  display:flex;
  flex-direction:column;
  gap:10px;
}

.header-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  color:var(--txt);
  margin:0;
  font-size:15px;
  font-weight:bold;
  letter-spacing:0.5px;
  text-shadow:0 0 6px rgba(0,255,255,0.25);
}

.time{
  color:#c7eaff;
  font-size:13px;
  font-weight:bold;
  opacity:.9;
}

.controls{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
}

.playbtn{
  width:46px;
  height:46px;
  border-radius:14px;
  cursor:pointer;
  border:1px solid rgba(0,255,255,0.25);

  background:linear-gradient(140deg, rgba(0,255,255,0.15), rgba(255,0,255,0.1));
  color:var(--txt);

  display:grid;
  place-items:center;
  transition:0.17s ease;

  box-shadow:
     0 0 8px rgba(0,255,255,0.35),
     inset 0 0 12px rgba(0,255,255,0.25);
}

.playbtn:hover{
  transform:scale(1.08);
  color:var(--hover);
  box-shadow:
     0 0 14px rgba(255,0,255,0.45),
     inset 0 0 16px rgba(0,255,255,0.35);
}

canvas.waves{
  width:100%;
  height:54px;
  border-radius:10px;

  background:rgba(0,0,0,0.2);
  border:1px solid rgba(0,255,255,0.18);

  box-shadow:
     inset 0 0 14px rgba(0,255,255,0.15),
     0 0 22px rgba(255,0,255,0.25);
}

/* MOBILE REDUCTION */
@media(max-width:420px){
  .playbtn{width:42px;height:42px;}
  .title{font-size:14px;}
}
</style>
</head>

<body>

<div class="player" id="player">

  <div class="header-line">
    <h1 class="title">Audio | Política de Privacidad</h1>
    <span class="time" id="time">0:00</span>
  </div>

  <div class="controls">
    <button class="playbtn" id="playBtn">
      <svg id="iconPlay" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg id="iconPause" width="22" height="22" fill="currentColor" style="display:none" viewBox="0 0 24 24">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>

    <canvas class="waves" id="wave"></canvas>
  </div>
</div>

<script>
/* ---------------- AUDIO ---------------- */
const audioUrl = "https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Records/Politica%20Privacidad.m4a";
const audio = new Audio(audioUrl);
audio.preload = "auto";
audio.crossOrigin = "anonymous";

const playBtn = document.getElementById("playBtn");
const iconPlay = document.getElementById("iconPlay");
const iconPause = document.getElementById("iconPause");
const timeEl = document.getElementById("time");

/* ----------- WEB AUDIO VISUALIZER ----------- */
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioContext();

const analyser = ctx.createAnalyser();
analyser.fftSize = 2048;

const src = ctx.createMediaElementSource(audio);
src.connect(analyser);
analyser.connect(ctx.destination);

/* ----------- CANVAS FX ----------- */
const canvas = document.getElementById("wave");
const dpr = window.devicePixelRatio || 1;

canvas.width = canvas.clientWidth * dpr;
canvas.height = canvas.clientHeight * dpr;

const c = canvas.getContext("2d");
c.scale(dpr,dpr);

function draw(){
  requestAnimationFrame(draw);

  const buffer = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buffer);

  c.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

  /* CYBERPUNK GRADIENT */
  const grad = c.createLinearGradient(0,0,canvas.clientWidth,0);
  grad.addColorStop(0, "#00eaff");
  grad.addColorStop(0.5, "#ff2dfc");
  grad.addColorStop(1, "#8a3aff");

  c.lineWidth = 2.6;
  c.strokeStyle = grad;
  c.beginPath();

  const slice = canvas.clientWidth / buffer.length;
  for(let i=0;i<buffer.length;i++){
    const v = buffer[i] / 128;
    const y = (v * canvas.clientHeight/2);
    if(i===0) c.moveTo(0,y);
    else c.lineTo(i*slice, y);
  }
  c.stroke();

  /* glow plasma */
  c.globalCompositeOperation = "lighter";
  c.fillStyle = "rgba(0,255,255,0.06)";
  c.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
  c.globalCompositeOperation = "source-over";
}
draw();

/* ----------- BOTÓN PLAY / PAUSE ----------- */
playBtn.addEventListener("click", async ()=>{
  if(ctx.state === "suspended") await ctx.resume();

  if(audio.paused){
    audio.play();
    iconPlay.style.display="none";
    iconPause.style.display="block";
  } else {
    audio.pause();
    iconPlay.style.display="block";
    iconPause.style.display="none";
  }
});

/* ----------- TIEMPO ----------- */
audio.addEventListener("timeupdate", ()=>{
  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60).toString().padStart(2,"0");
  timeEl.textContent = `${m}:${s}`;
});

/* ----------- AUTOPAUSA + RESET SI NO ES VISIBLE ----------- */
const player = document.getElementById("player");
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting){
      if(!audio.paused){
        audio.pause();
        audio.currentTime = 0;
        iconPlay.style.display="block";
        iconPause.style.display="none";
      }
    }
  });
},{threshold:0.45});
io.observe(player);

/* reset al terminar */
audio.addEventListener("ended", ()=>{
  audio.currentTime = 0;
  iconPlay.style.display="block";
  iconPause.style.display="none";
});
</script>

</body>
</html>
