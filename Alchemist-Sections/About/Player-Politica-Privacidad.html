<div class="matrix-player" id="matrixPlayer">
  <div class="matrix-header">
    <span class="matrix-title">Audio FX – Matrix Esmeralda</span>
    <button id="playBtn" class="matrix-btn">▶</button>
  </div>

  <canvas id="waveCanvas"></canvas>

  <audio id="audioFx" preload="auto">
    <source src="TU_AUDIO_AQUI.mp3" type="audio/mpeg" />
  </audio>
</div>

<style>
  .matrix-player {
    width: 280px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(0, 20, 0, 0.45);
    border: 1px solid rgba(0, 255, 120, 0.4);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 25px #00ff88aa inset, 0 0 25px #00ff8866;
    display: flex;
    flex-direction: column;
    gap: 10px;
    user-select: none;
    transition: 0.3s;
  }

  .matrix-player:hover {
    box-shadow: 0 0 35px #00ff88cc inset, 0 0 40px #00ff8877;
    transform: translateY(-2px);
  }

  .matrix-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .matrix-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: #00ff9d;
    text-shadow: 0 0 6px #00ffbb, 0 0 10px #00ff88;
    letter-spacing: 0.5px;
  }

  .matrix-btn {
    background: rgba(0, 255, 120, 0.1);
    border: 1px solid #00ff77;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: #00ff9d;
    transition: 0.2s;
    box-shadow: 0 0 12px #00ff8899 inset, 0 0 4px #00ff8888;
  }

  .matrix-btn:hover {
    background: rgba(0, 255, 120, 0.25);
    box-shadow: 0 0 18px #00ff88dd inset, 0 0 9px #00ff8877;
  }

  #waveCanvas {
    width: 100%;
    height: 70px;
    display: block;
    border-radius: 8px;
    background: rgba(0, 30, 0, 0.3);
    box-shadow: 0 0 18px #00ff8877 inset;
  }
</style>

<script>
const audio = document.getElementById("audioFx");
const playBtn = document.getElementById("playBtn");
const canvas = document.getElementById("waveCanvas");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

// ---------- Botón ----------
let isPlaying = false;

playBtn.addEventListener("click", () => {
  if (!isPlaying) {
    audio.currentTime = 0;
    audio.play();
    playBtn.textContent = "⏸";
    isPlaying = true;
  } else {
    audio.pause();
    playBtn.textContent = "▶";
    isPlaying = false;
  }
});

// ---------- Visualizador ----------
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const src = audioCtx.createMediaElementSource(audio);
const analyser = audioCtx.createAnalyser();

src.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize = 256;
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

function drawWave() {
  requestAnimationFrame(drawWave);
  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const barWidth = (canvas.width / bufferLength) * 1.6;
  let x = 0;

  for (let i = 0; i < bufferLength; i++) {
    const h = dataArray[i] / 2.2;
    
    // 🔥 TONO ANARANJADO FUEGO (con brillo)
    const fire = ctx.createLinearGradient(0, 0, 0, canvas.height);
    fire.addColorStop(0, "#ffb000");
    fire.addColorStop(0.5, "#ff6600");
    fire.addColorStop(1, "#ff2200");

    ctx.fillStyle = fire;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff6600";

    ctx.fillRect(x, canvas.height - h, barWidth, h);
    x += barWidth + 1.5;
  }
}

drawWave();

// ---------- Listener de visibilidad del elemento ----------
const player = document.getElementById("matrixPlayer");

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) {
      // si ya no está visible → pausa y reinicia
      audio.pause();
      audio.currentTime = 0;
      playBtn.textContent = "▶";
      isPlaying = false;
    }
  });
}, { threshold: 0.1 });

observer.observe(player);
</script>
