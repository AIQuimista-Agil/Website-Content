<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>HERMES TRISMEGISTUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-start:#001a09;
      --bg-end:#000;
      --green-1:#18ff5c;
      --green-2:#22ff77;
      --text:#aaffc3;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: radial-gradient(circle at center, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--green-1);
      font-family: 'Share Tech Mono', monospace;
      box-sizing: border-box;
      padding: 40px;
      overflow: hidden;
      text-shadow: 0 0 8px rgba(24, 255, 92, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Contenedor principal: una fila con dos columnas de 50% cada una */
    .title-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 50% 50%; /* cada columna 50% del ancho */
      align-items: center; /* centra verticalmente el contenido de la fila */
      box-sizing: border-box;
    }

    /* Estilo compartido para ambas celdas del título */
    .title-cell {
      font-family: 'Cinzel', serif;
      color: var(--green-2);
      font-size: clamp(28px, 6.5vw, 72px);
      text-shadow: 0 0 15px rgba(24, 255, 92, 0.9), 0 0 30px rgba(24, 255, 92, 0.4);
      animation: fireGlow 2.5s infinite alternate;
      letter-spacing: 0.40em;
      text-transform: uppercase;
      display: flex;
      align-items: center;    /* centra verticalmente dentro de la celda */
      justify-content: center;/* centra horizontalmente dentro de la celda */
      white-space: nowrap;
      height: 1.2em;
    }

    @keyframes fireGlow {
      0% {
        text-shadow:
          0 0 10px var(--green-1),
          0 0 20px #00ff88,
          0 0 30px #00ffaa,
          0 0 40px #00ff77;
      }
      100% {
        text-shadow:
          0 0 20px #00ff99,
          0 0 40px #00ff66,
          0 0 60px var(--green-1),
          0 0 80px #00ff44;
      }
    }

    /* Terminal / texto secundario (opcional) */
    #terminal {
      width: 100%;
      max-width: 900px;
      margin-top: 1.2rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: clamp(18px, 2.6vw, 26px);
      line-height: 1.9;
      letter-spacing: 0.40em;
      background: transparent;
      color: var(--text);
      text-align: center;
    }

    /* Responsive: en pantallas pequeñas apilar las dos palabras verticalmente */
    @media screen and (max-width: 720px) {
      .title-grid {
        grid-template-columns: 1fr;
        row-gap: 0.6rem;
      }
      .title-cell {
        justify-content: center;
        font-size: clamp(24px, 10vw, 48px);
        letter-spacing: 0.28em;
      }
      #terminal { font-size: clamp(14px, 4.5vw, 18px); letter-spacing: 0.28em; }
    }

    @media screen and (max-height: 520px) {
      body { padding: 20px; }
      .title-cell { font-size: clamp(20px, 6.5vw, 40px); }
    }
  </style>
</head>
<body>

  <div class="title-grid" role="presentation" aria-hidden="true">
    <div class="title-cell">HERMES</div>
    <div class="title-cell">TRISMEGISTUS</div>
  </div>

  <div id="terminal" aria-hidden="true">
    <!-- Texto secundario opcional -->
  </div>

</body>
</html>
