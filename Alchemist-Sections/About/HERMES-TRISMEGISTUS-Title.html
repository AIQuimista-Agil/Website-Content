<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HERMES TRISMEGISTUS</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --bg-start:#001a09;
  --bg-end:#000;
  --green-1:#18ff5c;
  --green-2:#22ff77;
  --text:#aaffc3;
}

html,body{
  height:100%;
  margin:0;
}

body {
  background: radial-gradient(circle at center, var(--bg-start) 0%, var(--bg-end) 100%);
  color: var(--green-1);
  font-family: 'Share Tech Mono', monospace;
  box-sizing: border-box;
  padding: 40px;
  overflow: hidden;
  text-shadow: 0 0 8px rgba(24, 255, 92, 0.6);
  display: flex;
  align-items: center;   /* ✔ CENTRADO VERTICAL */
  justify-content: center;
  min-height: 100vh;
}

/* ================================
   MARQUESINA CONTINUA SIN ESPACIOS
   ================================ */
.marquee {
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  position: relative;
}

.marquee-content {
  display: inline-flex;
  animation: marqueeScroll 20s linear infinite;
}

/* duplicamos contenido para evitar huecos */
.marquee-content span {
  margin-right: 2rem;
}

@keyframes marqueeScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); } /* mueve solo la mitad, porque hay contenido duplicado */
}

/* Estilos originales del texto Cinzel */
.cinzel {
  font-family: 'Cinzel', serif;
  font-size: clamp(28px, 6.5vw, 48px);
  color: var(--green-2);
  letter-spacing: 0.30em;
  text-shadow: 0 0 15px rgba(24, 255, 92, 0.9), 0 0 30px rgba(24, 255, 92, 0.4);
  animation: fireGlow 2.5s infinite alternate;
  text-transform: uppercase;
}

/* Estilos originales del texto Share Tech */
#terminal {
  font-family: 'Share Tech Mono', monospace;
  color: var(--text);
  letter-spacing: 0.40em;
  font-size: clamp(20px, 3vw, 26px);
  align-items: center;
}

/* Efecto glow original */
@keyframes fireGlow {
  0% {
    text-shadow: 0 0 10px var(--green-1), 0 0 20px #00ff88, 0 0 30px #00ffaa, 0 0 40px #00ff77;
  }
  100% {
    text-shadow: 0 0 20px #00ff99, 0 0 40px #00ff66, 0 0 60px var(--green-1), 0 0 80px #00ff44;
  }
}

</style>
</head>

<body>

<!-- ================================
     MARQUESINA PERFECTA
     ================================ -->
<div class="marquee">
  <div class="marquee-content">

    <!-- CONTENIDO ORIGINAL 1 -->
    <span class="cinzel">| HERMES TRISMEGISTUS |</span>
    <span id="terminal">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</span>

    <!-- DUPLICADO PARA QUE NO HAYA ESPACIOS -->
    <span class="cinzel">| HERMES TRISMEGISTUS |</span>
    <span id="terminal">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</span>

  </div>
</div>

</body>
</html>
