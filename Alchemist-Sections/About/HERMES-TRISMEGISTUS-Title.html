<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HERMES TRISMEGISTUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-start:#001a09;
      --bg-end:#000;
      --green-1:#18ff5c;
      --green-2:#22ff77;
      --text:#aaffc3;
    }

    html,body{
      height:100%;
      margin:0;
    }

    body {
      background: radial-gradient(circle at center, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--green-1);
      font-family: 'Share Tech Mono', monospace;
      box-sizing: border-box;
      padding: 40px;
      overflow: hidden;
      text-shadow: 0 0 8px rgba(24, 255, 92, 0.6);
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 100vh;
    }

    /* Contenedor que divide la pantalla en dos mitades horizontales */
    .split {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column; /* apila las mitades verticalmente (dos horizontales) */
      height: calc(100vh - 80px); /* resta el padding del body para ocupar toda la pantalla */
    }

    .half {
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Mantener el estilo del título pero centrado en su mitad */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 6.5vw, 48px);
      color: var(--green-2);
      margin: 0;
      text-shadow: 0 0 15px rgba(24, 255, 92, 0.9), 0 0 30px rgba(24, 255, 92, 0.4);
      animation: fireGlow 2.5s infinite alternate;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      display: block;
    }

    @keyframes fireGlow {
      0% {
        text-shadow: 
          0 0 10px var(--green-1),
          0 0 20px #00ff88,
          0 0 30px #00ffaa,
          0 0 40px #00ff77;
      }
      100% {
        text-shadow:
          0 0 20px #00ff99,
          0 0 40px #00ff66,
          0 0 60px var(--green-1),
          0 0 80px #00ff44;
      }
    }

    /* Terminal / texto centrado en su mitad */
    #terminal {
      width: 100%;
      max-width: 900px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: clamp(20px, 3vw, 26px);
      line-height: 1.9;
      letter-spacing: 0.40em; /* aún mayor espaciado entre letras */
      background: transparent;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      border: none;
      animation: none;
      color: var(--text);
      text-align: center;
    }

    /* Si quieres que cada mitad tenga un ligero separador visual opcional */
    .half.top {
      border-bottom: 1px solid rgba(34,255,119,0.04);
    }

    @media screen and (max-width: 900px) {
      body { padding: 20px; }
      .split { height: calc(100vh - 40px); }
      h1 { font-size: clamp(22px, 8vw, 36px); letter-spacing: 0.26em; }
      #terminal { font-size: clamp(16px, 4.5vw, 20px); letter-spacing: 0.26em; }
    }

    @media screen and (max-height: 600px) {
      /* En pantallas muy bajas, permitir scroll interno */
      .split { height: auto; min-height: 100vh; }
      body { overflow-y: auto; }
    }
  </style>
</head>
<body>

  <div class="split">
    <div class="half top">
      <h1>HERMES TRISMEGISTUS</h1>
    </div>

    <div class="half bottom">
      <div id="terminal">
        <!-- Aquí puedes insertar el texto que quieras mostrar en la mitad inferior -->
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      </div>
    </div>
  </div>

</body>
</html>
