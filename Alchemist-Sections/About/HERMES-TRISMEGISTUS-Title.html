<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HERMES TRISMEGISTUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #001a09 0%, #000 100%);
      color: #18ff5c;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 40px;
      overflow-x: hidden;
      text-shadow: 0 0 8px rgba(24, 255, 92, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* centra verticalmente */
      min-height: 100vh; /* ocupa toda la pantalla para centrar verticalmente */
      box-sizing: border-box;
      overflow: hidden;         /* ocultar scrollbar */
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 6.5vw, 48px);
      color: #22ff77;
      text-align: center;
      margin: 0 0 20px 0;
      text-shadow: 0 0 15px rgba(24, 255, 92, 0.9), 0 0 30px rgba(24, 255, 92, 0.4);
      animation: fireGlow 2.5s infinite alternate;
      letter-spacing: 0.30em; /* mayor espaciado tipo inscripción romana */
      text-transform: uppercase;
      width: 100%;
      display: block;
    }

    @keyframes fireGlow {
      0% {
        text-shadow: 
          0 0 10px #18ff5c,
          0 0 20px #00ff88,
          0 0 30px #00ffaa,
          0 0 40px #00ff77;
      }
      100% {
        text-shadow:
          0 0 20px #00ff99,
          0 0 40px #00ff66,
          0 0 60px #18ff5c,
          0 0 80px #00ff44;
      }
    }

    #terminal {
      max-width: 900px;
      width: 100%;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: clamp(20px, 3vw, 26px); /* aumentado */
      line-height: 1.9;
      letter-spacing: 0.30em; /* mayor espaciado tipo inscripción romana */
      background: transparent; /* elimina el cuadro */
      padding: 0; /* elimina el padding */
      border-radius: 0;
      box-shadow: none; /* elimina sombras */
      border: none; /* elimina borde */
      animation: none; /* elimina animación del cuadro */
      color: #aaffc3; /* mantiene legibilidad */
      text-align: center; /* centra el texto horizontalmente */
    }

    @keyframes greenFlame {
      0% {
        box-shadow: 0 0 15px rgba(24, 255, 92, 0.1) inset, 0 0 25px rgba(24, 255, 92, 0.2);
      }
      100% {
        box-shadow: 0 0 30px rgba(24, 255, 92, 0.3) inset, 0 0 50px rgba(24, 255, 92, 0.5);
      }
    }

    h2 {
      font-family: 'Cinzel', serif;
      color: #22ff77;
      text-shadow: 0 0 12px rgba(24, 255, 92, 0.8);
      margin-top: 25px;
      margin-bottom: 10px;
      font-size: 20px;
      letter-spacing: 0.30em;
    }

    p {
      margin: 6px 0;
      color: #aaffc3;
    }

    @media screen and (max-width: 600px) {
      body { padding: 20px; }
      #terminal { padding: 0; }
      h1 { font-size: clamp(22px, 8vw, 34px); letter-spacing: 0.22em; }
      #terminal { font-size: clamp(16px, 4.5vw, 20px); letter-spacing: 0.22em; }
    }
    
  </style>
</head>
<body>

  <h1>HERMES TRISMEGISTUS</h1>
  <div id="terminal"></div>

</body>
</html>
