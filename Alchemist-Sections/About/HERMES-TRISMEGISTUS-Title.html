<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HERMES TRISMEGISTUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #001a09 0%, #000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(32px, 6vw, 90px);
      color: #18ff5c;
      text-align: center;
      letter-spacing: 4px;
      text-shadow:
        0 0 10px #ffb347,
        0 0 20px #ff8c00,
        0 0 40px #ff7a00,
        0 0 70px #ff5500,
        0 0 100px #ff3300;
      animation: fireGlow 3s infinite alternate;
    }

    @keyframes fireGlow {
      0% {
        text-shadow:
          0 0 12px #ffcf70,
          0 0 25px #ff9d33,
          0 0 45px #ff6500,
          0 0 70px #ff4000;
        opacity: 0.9;
      }
      100% {
        text-shadow:
          0 0 20px #ffe0a6,
          0 0 35px #ffb347,
          0 0 60px #ff7a00,
          0 0 110px #ff5500;
        opacity: 1;
      }
    }

    /* Scrollbar fuego naranja */
    ::-webkit-scrollbar {
      width: 12px;
      background: #000;
    }

    ::-webkit-scrollbar-track {
      background: #000;
      box-shadow: inset 0 0 20px rgba(255,120,0,0.25);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: linear-gradient(
        180deg,
        #ffb347 0%,
        #ff8c00 40%,
        #ff5500 80%,
        #ff3300 100%
      );
      box-shadow:
        0 0 12px #ff8c00,
        0 0 25px #ff5500,
        inset 0 0 10px rgba(255,120,0,0.6);
      position: relative;
      overflow: hidden;
    }

    ::-webkit-scrollbar-thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255,150,0,0.0) 0%,
        rgba(255,150,0,0.5) 10%,
        rgba(255,150,0,0.0) 20%
      );
      background-size: 100% 150%;
      animation: orangeFlames 1.25s linear infinite;
      mix-blend-mode: screen;
    }

    @keyframes orangeFlames {
      0% { background-position: 0% 0%; opacity: 0.7; }
      50% { background-position: 0% 120%; opacity: 1; }
      100% { background-position: 0% 0%; opacity: 0.7; }
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #ff8c00 #000;
    }
  .titulo-container {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  margin-bottom: 20px;
}
.col-left, .col-right {
  font-family: 'Cinzel', serif;
  font-size: clamp(28px, 6.5vw, 48px);
  color: #22ff77;
  letter-spacing: 0.30em;
  text-shadow: 0 0 15px rgba(24, 255, 92, 0.9), 0 0 30px rgba(24, 255, 92, 0.4);
  animation: fireGlow 2.5s infinite alternate;
  flex: 1;
}
.col-left { text-align: right; padding-right: 2vw; }
.col-right { text-align: left; padding-left: 2vw; }
@media screen and (max-width: 600px) {
  .col-left, .col-right {
    font-size: clamp(22px, 8vw, 34px);
    letter-spacing: 0.22em;
  }
}
</style>
</head>
<body>
  <div class="titulo-container">
  <div class="col-left">HERMES</div>
  <div class="col-right">TRISMEGISTUS</div>
</div>
</body>
</html>
