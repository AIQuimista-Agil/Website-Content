<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HERMES TRISMEGISTUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #001a09 0%, #000 100%);
      color: #18ff5c;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 40px;
      overflow-x: hidden;
      text-shadow: 0 0 8px rgba(24, 255, 92, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 6.5vw, 48px); /* aumentado */
      color: #22ff77;
      text-align: center; /* centrado */
      margin: 0 0 20px 0;
      text-shadow: 0 0 15px rgba(24, 255, 92, 0.9), 0 0 30px rgba(24, 255, 92, 0.4);
      animation: fireGlow 2.5s infinite alternate;
      letter-spacing: 0.18em; /* espaciado tipo inscripción romana */
      text-transform: uppercase;
      width: 100%;
      display: block;
    }

    @keyframes fireGlow {
      0% {
        text-shadow: 
          0 0 10px #18ff5c,
          0 0 20px #00ff88,
          0 0 30px #00ffaa,
          0 0 40px #00ff77;
      }
      100% {
        text-shadow:
          0 0 20px #00ff99,
          0 0 40px #00ff66,
          0 0 60px #18ff5c,
          0 0 80px #00ff44;
      }
    }

    #terminal {
      max-width: 900px;
      width: 100%;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: clamp(18px, 2.6vw, 22px); /* aumentado */
      line-height: 1.9;
      letter-spacing: 0.18em; /* espaciado tipo inscripción romana */
      background: transparent; /* elimina el cuadro */
      padding: 0; /* elimina el padding */
      border-radius: 0;
      box-shadow: none; /* elimina sombras */
      border: none; /* elimina borde */
      animation: none; /* elimina animación del cuadro */
      color: #aaffc3; /* mantiene legibilidad */
    }

    @keyframes greenFlame {
      0% {
        box-shadow: 0 0 15px rgba(24, 255, 92, 0.1) inset, 0 0 25px rgba(24, 255, 92, 0.2);
      }
      100% {
        box-shadow: 0 0 30px rgba(24, 255, 92, 0.3) inset, 0 0 50px rgba(24, 255, 92, 0.5);
      }
    }

    h2 {
      font-family: 'Cinzel', serif;
      color: #22ff77;
      text-shadow: 0 0 12px rgba(24, 255, 92, 0.8);
      margin-top: 25px;
      margin-bottom: 10px;
      font-size: 20px;
    }

    p {
      margin: 6px 0;
      color: #aaffc3;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 24px;
      background-color: #18ff5c;
      animation: blink 1s step-end infinite, cursorFlame 2s infinite alternate;
      vertical-align: bottom;
      margin-left: 4px;
      box-shadow: 0 0 8px rgba(24, 255, 92, 0.9);
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes cursorFlame {
      0% {
        box-shadow: 0 0 8px rgba(24, 255, 92, 0.8), 0 0 15px #00ff66;
      }
      100% {
        box-shadow: 0 0 12px rgba(24, 255, 92, 1), 0 0 25px #00ff88;
      }
    }

    @media screen and (max-width: 600px) {
      body { padding: 20px; }
      #terminal { padding: 0; }
      .cursor { height: 20px; width: 10px; }
      h1 { font-size: clamp(22px, 8vw, 34px); letter-spacing: 0.14em; }
    }
    /*___________________________________________________________________________*/
    /* === SCROLLBAR – FUEGO VERDE === */

    /* Área del scroll */
    ::-webkit-scrollbar {
      width: 12px;
      background: #001a09; /* mismo fondo que tu página */
    }

    /* Pista del scroll (track) con glow */
    ::-webkit-scrollbar-track {
      background: #001a09;
      border-radius: 10px;
      box-shadow: inset 0 0 20px rgba(24, 255, 92, 0.12);
    }

    /* Pulgar (thumb) con efecto de fuego verde */
    ::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: linear-gradient(
        180deg,
        #18ff5c 0%,
        #22ff77 40%,
        #18ff5c 80%,
        #0aff4e 100%
      );
      position: relative;
      overflow: hidden;

      /* Glow verde */
      box-shadow:
        0 0 12px #18ff5c,
        0 0 20px #18ff5c,
        inset 0 0 10px rgba(24,255,92,0.7);
    }

    /* Llamas internas animadas */
    ::-webkit-scrollbar-thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(24,255,92,0.0) 0%,
        rgba(24,255,92,0.5) 10%,
        rgba(24,255,92,0.0) 20%
      );
      background-size: 100% 150%;
      animation: greenFlames 1.3s linear infinite;
      mix-blend-mode: screen;
    }

    /* Animación del fuego vertical */
    @keyframes greenFlames {
      0% { background-position: 0% 0%; opacity: 0.7; }
      50% { background-position: 0% 120%; opacity: 1; }
      100% { background-position: 0% 0%; opacity: 0.7; }
    }

    /* Hover más brillante */
    ::-webkit-scrollbar-thumb:hover {
      box-shadow:
        0 0 20px #22ff77,
        0 0 40px #22ff77,
        inset 0 0 14px rgba(24,255,92,1);
    }

    /* Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: #18ff5c #001a09;
    }
    /*___________________________________________________________________________*/
  </style>
</head>
<body>

  <h1>HERMES TRISMEGISTUS</h1>
  <div id="terminal"></div><span class="cursor"></span>

</body>
</html>
