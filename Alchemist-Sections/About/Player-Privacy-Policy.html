<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audio | Política de Privacidad</title>
<style>
  :root{
    --white: #ffffff;
    --accent: #ff3b3b; /* hover rojo */
    --wave1: #ff8a00; /* fuego */
    --wave2: #ff4500;
    --neon: rgba(0,255,128,0.9);
  }
  html,body{
    height:100%;
    margin:0;
    background: transparent;
    -webkit-font-smoothing:antialiased;
    font-family: Inter, system-ui, Arial, sans-serif;
  }
  .player-wrap{
    width: min(420px, 92%);
    max-width:420px;
    margin:24px auto;
    padding:14px;
    border-radius:16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 6px 12px rgba(0,0,0,0.25);
    transform: translateZ(0);
    display:flex;
    gap:12px;
    align-items:center;
  }
  .cover{
    width:72px;
    height:72px;
    border-radius:12px;
    overflow:hidden;
    flex:0 0 72px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 18px var(--neon);
  }
  .cover img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
  }
  .meta{
    flex:1;
    min-width:0;
  }
  .title{
    color:var(--white);
    font-weight:600;
    font-size:14px;
    margin:0 0 6px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .controls{
    display:flex;
    gap:10px;
    align-items:center;
  }
  button.playbtn{
    width:44px;
    height:44px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:transparent;
    color:var(--white);
    display:grid;
    place-items:center;
    cursor:pointer;
    transition: all .18s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 8px 30px rgba(255,255,255,0.02) inset;
  }
  button.playbtn:hover{ color:var(--accent); transform: translateY(-2px) scale(1.02); }
  .time{ color: rgba(255,255,255,0.8); font-size:12px; min-width:48px; text-align:right; }
  canvas.wave{
    width:100%;
    height:48px;
    display:block;
    border-radius:8px;
    margin-top:8px;
    background: transparent;
  }
  /* small responsive */
  @media (max-width:420px){
    .player-wrap{ padding:10px; gap:8px; }
    .cover{ width:60px; height:60px; flex:0 0 60px; }
    button.playbtn{ width:40px; height:40px; }
  }
</style>
</head>
<body>
  <main style="padding:12px;">
    <div class="player-wrap" id="player">
      <div class="cover" aria-hidden="true">
        <img src="https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Images/AI%20Logo%20Esmeralda%20-%20Transparente.png" alt="Portada" />
      </div>
      <div class="meta">
        <h1 class="title">Audio | Política de Privacidad</h1>
        <div class="controls">
          <button class="playbtn" id="playBtn" aria-label="Reproducir">
            <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div style="flex:1 1 auto; margin-left:6px;">
            <canvas id="wave" class="wave" aria-hidden="true"></canvas>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
              <div style="font-size:12px;color:rgba(255,255,255,0.8)">Política de Privacidad</div>
              <div class="time" id="time">0:00</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
  const audioUrl = "https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Records/Politica%20Privacidad.m4a";
  const audio = new Audio(audioUrl);
  audio.crossOrigin = "anonymous";
  audio.preload = "auto";

  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const timeEl = document.getElementById('time');

  // Web Audio API for visualizer
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioContext();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  const source = ctx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(ctx.destination);

  const canvas = document.getElementById('wave');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  const c = canvas.getContext('2d');
  c.scale(dpr,dpr);

  function draw(){
    requestAnimationFrame(draw);
    const bufferLength = analyser.fftSize;
    const data = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(data);

    c.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
    // gradient fuego
    const grad = c.createLinearGradient(0,0,canvas.clientWidth,0);
    grad.addColorStop(0, '#ff8a00');
    grad.addColorStop(0.5, '#ff4500');
    grad.addColorStop(1, '#ffb347');

    c.lineWidth = 2.5;
    c.strokeStyle = grad;
    c.beginPath();
    const slice = canvas.clientWidth / bufferLength;
    for(let i=0;i<bufferLength;i++){
      const v = data[i] / 128.0;
      const y = (v * canvas.clientHeight/2);
      if(i===0) c.moveTo(0,y);
      else c.lineTo(i*slice, y);
    }
    c.stroke();

    // glow effect
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = 'rgba(255,140,0,0.06)';
    c.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
    c.globalCompositeOperation = 'source-over';
  }

  draw();

  // play/pause toggle
  playBtn.addEventListener('click', async ()=>{
    if(ctx.state === 'suspended') await ctx.resume();
    if(audio.paused){
      audio.play();
      iconPlay.style.display='none';
      iconPause.style.display='block';
      playBtn.setAttribute('aria-label','Pausar');
    } else {
      audio.pause();
      iconPlay.style.display='block';
      iconPause.style.display='none';
      playBtn.setAttribute('aria-label','Reproducir');
    }
  });

  audio.addEventListener('timeupdate', ()=>{
    const s = Math.floor(audio.currentTime % 60).toString().padStart(2,'0');
    const m = Math.floor(audio.currentTime / 60);
    timeEl.textContent = `${m}:${s}`;
  });

  // IntersectionObserver: pausa y reinicia cuando no visible
  const player = document.getElementById('player');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting){
        if(!audio.paused){
          audio.pause();
          audio.currentTime = 0;
          iconPlay.style.display='block';
          iconPause.style.display='none';
        }
      }
    });
  }, {threshold: 0.5});
  io.observe(player);

  // ensure small resume behavior: when audio ends reset icons
  audio.addEventListener('ended', ()=>{
    audio.currentTime = 0;
    iconPlay.style.display='block';
    iconPause.style.display='none';
  });
</script>
</body>
</html>
