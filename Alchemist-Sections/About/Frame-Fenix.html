<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Frame Fenix</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

.video-observer-container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.video-observer-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
</head>

<body>

<div class="video-observer-container" id="videoObserverContainer">

  <video
    id="heroVideo"
    src="https://aiquimista-agil.github.io/Website-Content/Alchemist-Assets/Videos/Frame-Fenix.mp4"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
  </video>

</div>

<script>
(() => {

const containerEl = document.getElementById("videoObserverContainer");
const videoEl = document.getElementById("heroVideo");

let isVideoVisible = false;

/* ===== PAUSA ===== */
function pauseVideoOnHide() {
  try {
    videoEl.pause();
  } catch (e) {}
}

/* ===== REANUDAR ===== */
function resumeVideoOnShow() {
  videoEl.play().catch(() => {});
}

/* ===== OBSERVADOR DE VISIBILIDAD ===== */
const videoVisibilityObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.target !== containerEl) return;

    if (entry.isIntersecting && entry.intersectionRatio > 0) {
      isVideoVisible = true;
      resumeVideoOnShow();
    } else {
      isVideoVisible = false;
      pauseVideoOnHide();
    }
  });
}, { threshold: [0.01] });

videoVisibilityObserver.observe(containerEl);

/* ===== INICIALIZACIÓN ===== */
function initVideoObserver() {
  // Intentar autoplay inicial
  videoEl.play().catch(() => {});

  // Comprobar visibilidad inicial
  const rect = containerEl.getBoundingClientRect();
  const inViewport = rect.top < window.innerHeight && rect.bottom > 0;

  if (!inViewport) {
    pauseVideoOnHide();
  }
}

if (document.readyState === "complete") {
  initVideoObserver();
} else {
  window.addEventListener("load", initVideoObserver);
}

})();
</script>

</body>
</html>
