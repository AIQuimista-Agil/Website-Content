<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resultados de la Búsqueda | AI.Quimista Ágil</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    html, body {
      background: transparent;
      background-color: transparent;
      color: #ffb347;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 40px;
      overflow-x: hidden;
      text-shadow: 0 0 8px rgba(255, 150, 60, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(22px, 5vw, 32px);
      color: #ffcc55;
      text-align: center;
      margin-bottom: 20px;
      text-shadow:
        0 0 15px rgba(255, 160, 60, 0.9),
        0 0 30px rgba(255, 100, 0, 0.5),
        0 0 45px rgba(255, 140, 20, 0.4);
      animation: fireGlow 2.5s infinite alternate;
    }

    @keyframes fireGlow {
      0% {
        text-shadow:
          0 0 10px #ff8c3a,
          0 0 20px #ffb347,
          0 0 30px #ffcc66,
          0 0 40px #ff9933;
      }
      100% {
        text-shadow:
          0 0 20px #ffc266,
          0 0 40px #ff9933,
          0 0 60px #ff7a29,
          0 0 80px #ff5500;
      }
    }

    @keyframes greenFlame {
      0% {
        box-shadow:
          0 0 15px rgba(255, 140, 50, 0.15) inset,
          0 0 25px rgba(255, 120, 30, 0.25);
      }
      100% {
        box-shadow:
          0 0 30px rgba(255, 140, 50, 0.35) inset,
          0 0 50px rgba(255, 100, 0, 0.55);
      }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes cursorFlame {
      0% {
        box-shadow:
          0 0 8px rgba(255, 150, 80, 0.8),
          0 0 15px #ff9933;
      }
      100% {
        box-shadow:
          0 0 12px rgba(255, 170, 90, 1),
          0 0 25px #ffaa33;
      }
    }

    @media screen and (max-width: 600px) {
      body { padding: 20px; }
    }
  </style>
</head>

<body>
  <h1>Resultados de la Búsqueda | AI.Quimista Ágil</h1>
</body>
</html>
