<style>
/* === SCROLLBAR – FUEGO REALISTA INTENSO + PULSO ENERGÉTICO === */

/* Área general */
::-webkit-scrollbar {
  width: 14px;
  background: #120500; /* fondo oscuro volcánico */
}

/* Track */
::-webkit-scrollbar-track {
  background: #120500;
  border-radius: 12px;
  box-shadow: inset 0 0 25px rgba(255,90,0,0.20);
}

/* Pulgar (thumb) tipo fuego real */
::-webkit-scrollbar-thumb {
  border-radius: 12px;
  background: linear-gradient(
    180deg,
    #ffeb3b 0%,     /* amarillo brillante */
    #ff9800 30%,    /* naranja fuego */
    #ff5722 60%,    /* naranja rojizo */
    #ff3d00 100%    /* rojo intenso */
  );
  position: relative;
  overflow: hidden;

  /* Glow profundo + pulso energético */
  box-shadow:
    0 0 14px rgba(255,140,0,1),
    0 0 28px rgba(255,90,0,0.9),
    inset 0 0 16px rgba(255,200,0,0.9),
    inset 0 0 35px rgba(255,40,0,0.7),
    0 0 40px rgba(255,70,0,0.9);

  animation: firePulse 1.8s ease-in-out infinite;
}

/* Llamas internas realistas */
::-webkit-scrollbar-thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    180deg,
    rgba(255,180,0,0.0) 0%,
    rgba(255,200,0,0.6) 8%,
    rgba(255,100,0,0.0) 16%
  );
  background-size: 100% 160%;
  animation: flamesRise 1.2s linear infinite;
  mix-blend-mode: screen; 
}

/* Chispas internas */
::-webkit-scrollbar-thumb::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, transparent 70%);
  background-size: 20% 200%;
  background-position: center;
  animation: sparks 0.18s infinite, sparksMove 1.4s linear infinite;
  mix-blend-mode: lighten;
}

/* Animación de llamas verticales */
@keyframes flamesRise {
  0% { background-position: 0% 100%; opacity: 0.7; }
  50% { background-position: 0% 20%; opacity: 1; }
  100% { background-position: 0% 100%; opacity: 0.75; }
}

/* Pulso energético (latido) */
@keyframes firePulse {
  0% { transform: scale(1); box-shadow: 0 0 14px #ff8c00, 0 0 28px #ff5a00; }
  50% { transform: scale(1.08); box-shadow: 0 0 30px #ffc400, 0 0 50px #ff3d00; }
  100% { transform: scale(1); box-shadow: 0 0 14px #ff8c00, 0 0 28px #ff5a00; }
}

/* Chispa vibrante */
@keyframes sparks {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* Movimiento de chispas */
@keyframes sparksMove {
  0%   { background-position-y: 100%; }
  100% { background-position-y: -100%; }
}

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: #ff6f00 #120500;
}
</style>
